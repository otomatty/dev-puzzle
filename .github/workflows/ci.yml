name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # main は途中で止めるとマイグレーションだけ反映されてデプロイされないことがあるので、
  # 前の実行が終わるのを待つ(待っている実行は、さらに新しい push が来たら取り消される)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Lint・型チェック・テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest・Wrangler・Vite は Node.js 上で動く
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci --reporter=github .
      - name: 型チェック
        run: bun run typecheck
      - name: シードが catalog.ts と一致しているか
        run: |
          bun run db:generate-seed
          git diff --exit-code seeds/
      - name: Vitest
        run: bun run test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # main に入ったら、テストと E2E が通ったあとで本番にデプロイする
  deploy:
    name: Cloudflare にデプロイ
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://robozzle.saedgewell.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # 新しいコードが使う表やステージを先に入れておく。シードは upsert なのでクリア人数は残る
      - name: D1 にマイグレーションとステージを反映
        run: bun run db:setup:remote
      - name: デプロイ
        run: bun run deploy
